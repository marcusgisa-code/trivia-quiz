      }

      state.currentQuestion = question;
      state.currentDifficulty = question.difficulty;
      state.currentVisibleAnswers = 0;
      state.selectedMultiplier = 1;

      els.uiUsername.textContent = state.username;
      if (els.uiAvatar) els.uiAvatar.textContent = (state.username[0] || "?").toUpperCase();

      const levelLabels = { 1: "Leicht", 2: "Mittel", 3: "Schwer" };
      const lvl = question.difficulty;
      els.uiRoundDifficulty.querySelector(".label-frage").textContent = String(state.round);
      els.uiRoundDifficulty.querySelector(".label-level").textContent = levelLabels[lvl] || "Leicht";
      els.uiRoundDifficulty.className = `tb-chips level-${lvl}`;

      els.uiScore.textContent = `${state.totalScore} in Folge`;
      els.questionText.textContent = question.question;
      els.questionText.classList.remove("fade-in");
      void els.questionText.offsetWidth;
      els.questionText.classList.add("fade-in");

      updateJokerUi();

      showScreen("quiz");

      await wait(800);
      if (token !== state.flowToken) return;
      state.currentVisibleAnswers = 1;
      renderVisibleAnswers(1);

      await wait(1000);
      if (token !== state.flowToken) return;
      state.currentVisibleAnswers = 2;
      renderVisibleAnswers(2);

      await wait(1000);
      if (token !== state.flowToken) return;
      state.currentVisibleAnswers = 3;
      renderVisibleAnswers(3);

      startTimerClassic(token);

      await wait(1600);
      if (token !== state.flowToken) return;
      revealJokerButton();
      revealFiftyFiftyButton();
    }

    function tickTimerClassic(token) {
      state.timerId = setInterval(() => {
        state.timerValue -= 1;
        els.uiTimerNum.textContent = String(Math.max(0, state.timerValue));
        els.uiTimer.classList.toggle("is-penalty", state.timerValue <= 5);
        if (state.timerValue <= 0) {
          clearInterval(state.timerId);
          if (token !== state.flowToken) return;
          handleTimeUpClassic();
        }
      }, 1000);
    }

    function startTimerClassic(token) {
      clearInterval(state.timerId);
      state.timerValue = CLASSIC_TIME_LIMIT;
      els.uiTimerNum.textContent = String(state.timerValue);
      els.uiTimer.classList.remove("is-penalty");
      tickTimerClassic(token);
    }

    // Setzt den laufenden Countdown unverändert fort (z.B. nach der kurzen
    // Pause während der 50:50-Joker-Animation) statt ihn zurückzusetzen.
    function resumeTimerClassic(token) {
      clearInterval(state.timerId);
      tickTimerClassic(token);
    }

    function handleTimeUpClassic() {
      if (!state.currentQuestion) return;
      state.roundAnswered = true;
      if (els.jokerWrap) els.jokerWrap.classList.add("hidden");
      if (els.fiftyWrap) els.fiftyWrap.classList.add("hidden");
      lockAllAnswers();
      handleWrong(0);
    }

    function chooseAnswerClassic(position) {
      if (!state.currentQuestion) return;

      state.roundAnswered = true;
      stopTimer();
      if (els.jokerWrap) els.jokerWrap.classList.add("hidden");
      if (els.fiftyWrap) els.fiftyWrap.classList.add("hidden");
      lockAllAnswers();

      const clickedRow = [...els.answers.children].find(btn => Number(btn.dataset.position) === position);
      if (clickedRow) clickedRow.classList.add("clicked-state");

      window.setTimeout(() => {
        if (clickedRow) clickedRow.classList.remove("clicked-state");
        const isCorrect = position === state.currentQuestion.correctPosition;
        if (isCorrect) {
          classicHandleCorrect();
        } else {
          handleWrong(position);
        }
      }, 1000);
    }

    // Effekt-Klasse für die "Score für Frage"-Zahl, gestaffelt nach
    // erreichter Punktzahl (nur Modus Klassisch ohne KI-Fragen).
    function soloScoreEffectClass(points) {
      if (points >= 30) return "score-effect-bounce";
      if (points >= 20) return "score-effect-fade-fast";
      if (points >= 10) return "score-effect-fade-slow";
      return "";
    }

    function classicHandleCorrect() {
      playSound("correct");
      state.totalScore += 1;
      state.correctStreak += 1;
      state.questionsPlayed += 1;
      state.correctAnswers += 1;

      // Einzelspieler-Score (nur im Klassisch-Modus ohne KI-Fragen, unabhängig
      // von der bestehenden Serie): Punkte pro Frage = (Schwierigkeitsgrad ×
      // Restsekunden bei Beantwortung) / 2. state.timerValue hält zu diesem
      // Zeitpunkt noch den Stand, bei dem stopTimer() in chooseAnswerClassic()
      // den Countdown eingefroren hat.
      if (state.gameMode === "classic") {
        const points = Math.max(0, Math.round((state.currentQuestion.difficulty * state.timerValue) / 2));
        state.classicSoloScore += points;
        state.lastClassicSoloPoints = points;
      }

      // Alle 5 richtig beantworteten Fragen gibt's einen zusätzlichen Joker
      if (state.correctAnswers % 5 === 0) {
        state.jokersLeft += 1;
        showJokerAwardAnimation("5 Richtig → +1 Joker");
      }

      // Alle 3 richtig beantworteten Level-3-Fragen gibt's einen
      // zusätzlichen 50:50-Joker
      if (state.currentQuestion.difficulty === 3) {
        state.hardCorrectCount += 1;
        if (state.hardCorrectCount % 3 === 0) {
          state.fiftyFiftyLeft += 1;
          showJokerAwardAnimation("3× Schwer richtig → +1 50:50-Joker");
        }
      }

      if (els.uiScore) els.uiScore.textContent = `${state.totalScore} in Folge`;

      const correctText = state.currentQuestion.answers[state.currentQuestion.correctPosition - 1];

      els.answers.innerHTML = "";
      const correctRow = createAnswerRow(0, correctText);
      correctRow.disabled = true;
      correctRow.classList.add("locked", "correct-state");
      correctRow.dataset.position = "1";
      els.answers.appendChild(correctRow);

      const richtigText = randomRichtigText(state.currentQuestion.difficulty);
      const soloScoreLine = state.gameMode === "classic"
        ? `<br><span class="result-points-sub"><span class="result-label">Score für Frage:</span> <span class="result-value result-value-solo ${soloScoreEffectClass(state.lastClassicSoloPoints)}">${state.lastClassicSoloPoints}</span></span>`
        : "";
      els.resultPoints.innerHTML = `<span class="result-feedback-text" id="result-richtig-headline"></span><br><span class="result-points-sub"><span class="result-label">Korrekte Antworten:</span> <span class="result-value result-value-correct">${state.totalScore}</span></span>${soloScoreLine}`;
      els.resultPoints.classList.remove("hidden");
      els.resultPoints.classList.add("fade-in");
      typewriterReveal(document.getElementById("result-richtig-headline"), richtigText);

      els.resultTotal.classList.add("hidden");
      els.resultInfo.classList.add("hidden");

      showContinueDisabledThenEnable(false);
    }

    function nextRoundClassic() {
      state.round += 1;
      loadRoundClassic();
    }

    function jokerSkip() {
      if (state.roundAnswered) return;
      if (state.jokersLeft <= 0) return;
      if (!state.currentQuestion) return;

      state.jokersLeft -= 1;
      state.questionsPlayed += 1;
      state.roundAnswered = true; // sperrt Interaktionen, während der Auflöse-Effekt läuft
      stopTimer();
      lockAllAnswers();
      if (els.jokerWrap) els.jokerWrap.classList.add("hidden");
      if (els.fiftyWrap) els.fiftyWrap.classList.add("hidden");

      runSkipDissolveEffect(() => {
        state.round += 1;
        if (isClassicMode()) {
          loadRoundClassic();
        } else {
          loadRound();
        }
      });
    }

    // ── /Klassisch-Modus ─────────────────────────────────────────────────

    function chooseAnswer(position) {
      if (!state.currentQuestion) return;

      state.roundAnswered = true;
      stopTimer();
      els.nextAnswerWrap.classList.add("hidden");
      if (els.jokerWrap) els.jokerWrap.classList.add("hidden");
      if (els.fiftyWrap) els.fiftyWrap.classList.add("hidden");
      lockAllAnswers();

      // Show clicked state immediately
      const clickedRow = [...els.answers.children].find(btn => Number(btn.dataset.position) === position);
      if (clickedRow) clickedRow.classList.add("clicked-state");

      // Wait 1 second before revealing result
      window.setTimeout(() => {
        if (clickedRow) clickedRow.classList.remove("clicked-state");
        const isCorrect = position === state.currentQuestion.correctPosition;
        if (isCorrect) {
          handleCorrect();
        } else {
          handleWrong(position);
        }
      }, 1000);
    }

    function lockAllAnswers() {
      [...els.answers.children].forEach(btn => {
        btn.classList.add("locked");
        btn.disabled = true;
      });
    }

    function showContinueDisabledThenEnable(showTotalLater) {
      els.continueBtn.classList.remove("hidden");
      els.continueBtn.classList.add("is-disabled");
      els.continueBtn.disabled = true;
      els.continueBtn.classList.add("fade-in");

      window.setTimeout(() => {
        if (showTotalLater) {
          els.resultTotal.classList.remove("hidden");
          els.resultTotal.classList.add("fade-in");
        }
        els.continueBtn.disabled = false;
        els.continueBtn.classList.remove("is-disabled");
      }, 2000);
    }

    function clearGameOverMode() {
      els.goCard.classList.add("hidden");
      els.questionBox.classList.remove("hidden");
      els.answers.classList.remove("hidden");
      els.belowPanel.classList.remove("hidden");
    }

    // ── Edit Mode ─────────────────────────────────────────────────────────

    const editState = { questions: [], currentIndex: 0 };

    function editGetBadIds() {
      try { return new Set(JSON.parse(localStorage.getItem("editBadIds") || "[]")); }
      catch { return new Set(); }
    }
    function editGetPool() {
      try { return JSON.parse(localStorage.getItem("editPool") || "[]"); }
      catch { return []; }
    }
    function editSaveBadIds(idSet) {
      localStorage.setItem("editBadIds", JSON.stringify([...idSet]));
    }
    function editSavePool(pool) {
      localStorage.setItem("editPool", JSON.stringify(pool));
    }

    function editUpdateBadCount() {
      els.editBadCount.textContent = String(editGetBadIds().size);
    }

    async function showEditMode() {
      const username = els.usernameInput.value.trim();
      const plz = els.plzInput.value.trim();
      if (!username || !plz) { els.usernameInput.focus(); return; }

      showScreen("edit");
      editState.currentIndex = 0;
      editState.questions = [];
      els.editOkBtn.disabled = true;
      els.editBadBtn.disabled = true;
      els.editBackBtn.disabled = true;
      els.editStatus.textContent = "Alle Fragen werden geladen…";
      els.editStatus.classList.remove("hidden");
      editUpdateBadCount();

      const badIds = editGetBadIds();
      let loaded = [];
      try {
        const res = await fetch(API_URL + "?all=1");
        const data = await res.json();
        if (data && data.length) loaded = data;
      } catch (e) {
        loaded = parseCsv(DEMO_CSV);
      }

      editState.questions = loaded.filter(q => !badIds.has(q.id));
      editState.currentIndex = 0;
      els.editStatus.classList.add("hidden");
      editShowQuestion();
    }

    function editShowQuestion() {
      const total = editState.questions.length;
      editUpdateBadCount();

      if (total === 0) {
        els.editQuestionText.textContent = "Keine Fragen mehr im Pool.";
        els.editAnswers.innerHTML = "";
        els.editStatus.textContent = "Alle Fragen bewertet.";
        els.editStatus.classList.remove("hidden");
        els.editOkBtn.disabled = true;
        els.editBadBtn.disabled = true;
        els.editBackBtn.disabled = true;
        return;
      }

      const q = editState.questions[editState.currentIndex];
      els.editIdx.textContent = String(editState.currentIndex + 1);
      els.editTotal.textContent = String(total);
      els.editQuestionText.textContent = q.question;

      const labels = ["A", "B", "C"];
      els.editAnswers.innerHTML = "";
      q.answers.forEach((ans, i) => {
        const div = document.createElement("div");
        const correct = (i + 1) === q.correctPosition;
        div.className = "edit-answer" + (correct ? " is-correct" : "");
        div.innerHTML = `<span class="ea-label">${labels[i]}</span><span>${ans}</span>`;
        els.editAnswers.appendChild(div);
      });

      els.editOkBtn.disabled = false;
      els.editBadBtn.disabled = false;
      els.editBackBtn.disabled = editState.currentIndex === 0;
      els.editStatus.classList.add("hidden");
    }

    function editNext() {
      editState.currentIndex += 1;
      if (editState.currentIndex >= editState.questions.length) {
        editState.currentIndex = editState.questions.length;
      }
      editShowQuestion();
    }

    function editPrev() {
      if (editState.currentIndex > 0) {
        editState.currentIndex -= 1;
        editShowQuestion();
      }
    }

    function editMarkOk() { editNext(); }

    function editMarkBad() {
      const q = editState.questions[editState.currentIndex];

      const pool = editGetPool();
      if (!pool.find(p => p.id === q.id)) { pool.push(q); editSavePool(pool); }

      const badIds = editGetBadIds();
      badIds.add(q.id);
      editSaveBadIds(badIds);

      editState.questions.splice(editState.currentIndex, 1);
      if (editState.currentIndex >= editState.questions.length) {
        editState.currentIndex = Math.max(0, editState.questions.length - 1);
      }
      editShowQuestion();
    }

    // ── /Edit Mode ────────────────────────────────────────────────────────

    function renderGameOverSummary() {
      // Hide question area, show card
      els.questionBox.classList.add("hidden");
      els.answers.classList.add("hidden");
      els.belowPanel.classList.add("hidden");

      els.goPlayerName.textContent = state.username || "–";
      els.goQuestionsPlayed.textContent = `${state.questionsPlayed} Frage${state.questionsPlayed !== 1 ? "n" : ""} gespielt`;
      els.goScore.textContent = String(state.totalScore);
      els.goQuestions.textContent = String(state.questionsPlayed);
      els.goCorrect.textContent = String(state.correctAnswers);
      if (els.goScoreLabel) {
        els.goScoreLabel.textContent = isClassicMode() ? "Serie" : "Punkte";
      }
      // In den Klassisch-Modi zählt "Serie" (totalScore) immer 1:1 mit
      // "Richtig" (correctAnswers) hoch (siehe classicHandleCorrect()) und
      // ist damit ein reines Duplikat – dort ausgeblendet. Im Modus
      // "Neues Spielprinzip" ist "Punkte" (variable Formel-Punkte) davon
      // unabhängig und bleibt sichtbar.
      if (els.goScoreStat) {
        els.goScoreStat.classList.toggle("hidden", isClassicMode());
      }

      // Gesamtpunktzahl der Spielrunde nach dem neuen Score-System
      // (Schwierigkeitsgrad × Restsekunden / 2 pro Frage) – nur im
      // Klassisch-Modus ohne KI-Fragen sichtbar.
      if (els.goSoloScoreStat && els.goSoloScore) {
        if (state.gameMode === "classic") {
          els.goSoloScore.textContent = String(state.classicSoloScore);
          els.goSoloScoreStat.classList.remove("hidden");
        } else {
          els.goSoloScoreStat.classList.add("hidden");
        }
      }

      els.goCard.classList.remove("hidden");
      els.goCard.classList.add("fade-in");
    }

    function restoreBelowPanelStructure() {
      const panel = document.querySelector(".below-panel");
      panel.innerHTML = "";
      panel.appendChild(els.nextAnswerWrap);
      panel.appendChild(els.resultPoints);
      panel.appendChild(els.resultTotal);
      panel.appendChild(els.resultInfo);
      if (els.jokerAward) panel.appendChild(els.jokerAward);
      panel.appendChild(els.continueBtn);
      panel.appendChild(els.restartBtn);
    }

    function handleWrong(position) {
      playSound("wrong");
      const row = [...els.answers.children].find(btn => Number(btn.dataset.position) === position);
      if (row) row.classList.add("wrong-state");

      // After 1 second: show correct answer in green, then game over
      window.setTimeout(() => {
        // Find and highlight the correct answer among visible buttons
        const correctPos = state.currentQuestion.correctPosition;
        const correctRow = [...els.answers.children].find(btn => Number(btn.dataset.position) === correctPos);
        if (correctRow) {
          correctRow.classList.add("correct-state");
        } else {
          // Correct answer not visible – append it
          const correctText = state.currentQuestion.answers[correctPos - 1];
          const newRow = createAnswerRow(correctPos - 1, correctText);
          newRow.disabled = true;
          newRow.classList.add("locked", "correct-state");
          newRow.dataset.position = String(correctPos);
          els.answers.appendChild(newRow);
        }

        // Kurze Pause, damit die korrekte Antwort noch wahrgenommen wird –
        // danach einen zufälligen "Falsch"-Text zeigen und auf den nächsten
        // Klick auf "Weiter" warten, statt automatisch zum Game Over
        // überzugehen.
        window.setTimeout(() => {
          stopTimer();
          state.questionsPlayed += 1;

          const falschText = randomFalschText(state.currentQuestion.difficulty);
          els.resultPoints.innerHTML = `<span class="result-feedback-text">${falschText}</span>`;
          els.resultPoints.classList.remove("hidden");
          els.resultPoints.classList.add("fade-in");

          state.pendingGameOver = true;
          showContinueDisabledThenEnable(false);
        }, 1200);
      }, 1000);
    }

    function handleCorrect() {
      const basePoints = getBasePoints();
      const penaltyPoints = Math.max(0, state.timerValue - 10);
      const finalPoints = basePoints - penaltyPoints;

      if (finalPoints < 0) {
        handleWrong(0);
        return;
      }

      playSound("correct");
      state.totalScore += finalPoints;
      state.correctStreak += 1;
      state.questionsPlayed += 1;
      state.correctAnswers += 1;

      // Alle 5 richtig beantworteten Fragen gibt's einen zusätzlichen Joker
      if (state.correctAnswers % 5 === 0) {
        state.jokersLeft += 1;
        showJokerAwardAnimation("5 Richtig → +1 Joker");
      }

      // Alle 3 richtig beantworteten Level-3-Fragen gibt's einen
      // zusätzlichen 50:50-Joker
      if (state.currentQuestion.difficulty === 3) {
        state.hardCorrectCount += 1;
        if (state.hardCorrectCount % 3 === 0) {
          state.fiftyFiftyLeft += 1;
          showJokerAwardAnimation("3× Schwer richtig → +1 50:50-Joker");
        }
      }

      // Update score display in header
      if (els.uiScore) els.uiScore.textContent = `${state.totalScore} Punkte`;

      const correctText = state.currentQuestion.answers[state.currentQuestion.correctPosition - 1];

      els.answers.innerHTML = "";
      const correctRow = createAnswerRow(0, correctText);
      correctRow.disabled = true;
      correctRow.classList.add("locked", "correct-state");
      correctRow.dataset.position = "1";
      els.answers.appendChild(correctRow);

      els.resultPoints.textContent = `Frage: ${finalPoints} Punkte`;
      els.resultPoints.classList.remove("hidden");
      els.resultPoints.classList.add("fade-in");

      const showTotalLater = state.round >= 2;
      if (showTotalLater) {
        els.resultTotal.textContent = `Score: ${state.totalScore} Punkte`;
        els.resultTotal.classList.add("hidden");
      } else {
        els.resultTotal.textContent = "";
        els.resultTotal.classList.add("hidden");
      }

      if (penaltyPoints > 0) {
        els.resultInfo.textContent = `Basis ${basePoints} – ${penaltyPoints} Punkte Zeitabzug`;
        els.resultInfo.classList.remove("hidden");
        els.resultInfo.classList.add("fade-in");
      } else {
        els.resultInfo.textContent = "";
        els.resultInfo.classList.add("hidden");
      }

      showContinueDisabledThenEnable(showTotalLater);
    }

    function nextRound() {
      state.round += 1;
      loadRound();
    }

    // Löst eine PLZ per kostenloser, CORS-freier API zu einem Ortsnamen auf und
    // speichert ihn dauerhaft am Bezirks-Dokument. Läuft im Hintergrund (nicht
    // awaited), damit ein langsamer/ausgefallener Dienst "Spiel starten" nie blockiert.
    async function lookupAndSaveOrtsname(plz) {
      try {
        const res = await fetch(`https://api.zippopotam.us/de/${plz}`, { signal: AbortSignal.timeout(3000) });
        if (!res.ok) return;
        const data = await res.json();
        const ort = data.places && data.places[0] && data.places[0]["place name"];
        if (ort && typeof window.saveDistrictOrt === "function") {
          window.saveDistrictOrt(plz, ort);
        }
      } catch (e) { /* silent – Ortsname bleibt dann einfach leer */ }
    }

    async function startGame() {
      const rawName = els.usernameInput.value.trim();
      if (!rawName) {
        alert("Bitte gib zuerst einen Namen ein.");
        els.usernameInput.focus();
        return;
      }

      const rawPlz = els.plzInput.value.trim();

      if (!/^\d{5}$/.test(rawPlz)) {
        alert("Bitte gib eine gültige 5-stellige Postleitzahl ein.");
        els.plzInput.focus();
        return;
      }

      state.username = rawName.slice(0, 12);
      state.plz = rawPlz;
      lookupAndSaveOrtsname(state.plz); // im Hintergrund, blockiert den Spielstart nicht

      // Sicherstellen dass Fragen geladen sind (Klassisch mit KI-Fragen nutzt einen eigenen, lokalen Pool)
      if (state.gameMode !== "classic-ki" && !state.questions.length) {
        els.startBtn.disabled = true;
        els.loadingHint.classList.remove("hidden");
        try {
          const res = await fetch(`${API_URL}?count=50`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.length) state.questions = data;
          }
        } catch (e) { /* ignored */ }
        if (!state.questions.length) {
          state.questions = parseCsv(DEMO_CSV);
        }
        els.loadingHint.classList.add("hidden");
        els.startBtn.disabled = false;
      }

      // Bereits gesehene Fragen dieser PLZ laden, bevor die erste Frage gezogen wird.
      try {
        const seenArr = typeof window.loadDistrictSeenIds === "function"
          ? await window.loadDistrictSeenIds(state.plz)
          : [];
        state.districtSeenIds = new Set(seenArr);
      } catch (e) {
        state.districtSeenIds = new Set();
      }

      resetRun();
      if (isClassicMode()) {
        loadRoundClassic();
      } else {
        loadRound();
      }
    }

    const API_URL = "https://trivia-quiz-api.marcus-gisa1.workers.dev";

    async function loadQuestionsFromAPI() {
      try {
        const res = await fetch(`${API_URL}?count=50`);
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.length) {
          const badIds = editGetBadIds();
          state.questions = badIds.size > 0 ? data.filter(q => !badIds.has(q.id)) : data;
        }
      } catch (e) { /* silent fallback — startGame handles missing questions */ }
    }

    let highscoreMode = "new";

    function updateHsTabsUi() {
      if (!els.hsTabs) return;
      els.hsTabs.forEach(tab => {
        tab.classList.toggle("is-active", tab.dataset.mode === highscoreMode);
      });
    }

    async function showHighscores(mode) {
      highscoreMode = mode || state.gameMode || "new";
      updateHsTabsUi();
      showScreen("highscore");
      els.highscoreList.innerHTML = '<p class="hs-loading">Wird geladen…</p>';

      const isSolo = highscoreMode === "classic-solo";
      const scores = isSolo
        ? (typeof window.loadClassicSoloHighscores === "function" ? await window.loadClassicSoloHighscores() : [])
        : (typeof window.loadHighscores === "function" ? await window.loadHighscores(highscoreMode) : []);

      if (!scores.length) {
        els.highscoreList.innerHTML = '<p class="hs-loading">Noch keine Einträge.</p>';
        return;
      }

      const table = document.createElement("table");
      table.className = "hs-table";
      const tbody = document.createElement("tbody");

      if (isSolo) {
        // Einzelspieler-Liste: jede Zeile ist ein einzelner Spieldurchlauf
        // (Name + PLZ + dessen Score), keine Bezirks-Summe über mehrere Spiele.
        table.innerHTML = `<thead><tr>
          <th class="hs-rank">#</th>
          <th>Name</th>
          <th>PLZ</th>
          <th class="hs-score">Punkte</th>
        </tr></thead>`;
        scores.forEach((s, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="hs-rank">${i + 1}</td>
            <td>${s.username || "–"}</td>
            <td>${s.plz || "–"}</td>
            <td class="hs-score">${s.score}</td>`;
          tbody.appendChild(tr);
        });
      } else {
        const scoreLabel = highscoreMode === "new" ? "Punkte gesamt" : "Serie gesamt";
        table.innerHTML = `<thead><tr>
          <th class="hs-rank">#</th>
          <th>PLZ</th>
          <th class="hs-score">${scoreLabel}</th>
          <th class="hs-score">Spiele</th>
          <th class="hs-score">Ø / Spiel</th>
        </tr></thead>`;
        scores.forEach((s, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="hs-rank">${i + 1}</td>
            <td>${[s.plz, s.ort].filter(Boolean).join(" ")}</td>
            <td class="hs-score">${s.score}</td>
            <td class="hs-score">${s.games}</td>
            <td class="hs-score">${s.average}</td>`;
          tbody.appendChild(tr);
        });
      }

      table.appendChild(tbody);
      els.highscoreList.innerHTML = "";
      els.highscoreList.appendChild(table);
    }

    if (els.startBtn) els.startBtn.addEventListener("click", startGame);
    if (els.usernameInput) els.usernameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") startGame();
    });

    if (els.highscoreBtn) els.highscoreBtn.addEventListener("click", () => showHighscores());
    if (els.backBtn) els.backBtn.addEventListener("click", () => showScreen("welcome"));

    if (els.hsTabs) {
      els.hsTabs.forEach(tab => {
        tab.addEventListener("click", () => showHighscores(tab.dataset.mode));
      });
    }

    els.nextAnswerBtn.addEventListener("click", revealNextAnswer);
    els.continueBtn.addEventListener("click", () => {
      if (state.pendingGameOver) {
        state.pendingGameOver = false;
        renderGameOverSummary();
        if (typeof window.saveScore === "function") {
          window.saveScore(state.plz, state.totalScore, state.gameMode);
        }
        // Zusätzlich zur unveränderten Bezirks-Serie: eigener Einzelspieler-Score,
        // nur im Klassisch-Modus ohne KI-Fragen.
        if (state.gameMode === "classic" && typeof window.saveClassicSoloScore === "function") {
          window.saveClassicSoloScore(state.username, state.plz, state.classicSoloScore);
        }
        els.goRestartBtn.disabled = true;
        window.setTimeout(() => {
          els.goRestartBtn.disabled = false;
        }, 1200);
        return;
      }
      if (isClassicMode()) {
        nextRoundClassic();
      } else {
        nextRound();
      }
    });
    els.restartBtn.addEventListener("click", () => {
      resetRun();
      if (isClassicMode()) {
        loadRoundClassic();
      } else {
        loadRound();
      }
    });
    els.goRestartBtn.addEventListener("click", () => {
      resetRun();
      if (isClassicMode()) {
        loadRoundClassic();
      } else {
        loadRound();
      }
    });
    els.goHsBtn.addEventListener("click", () => showHighscores());
    els.goMenuBtn.addEventListener("click", () => {
      resetRun();
      showScreen("welcome");
    });

    if (els.jokerBtn) els.jokerBtn.addEventListener("click", jokerSkip);
    if (els.fiftyBtn) els.fiftyBtn.addEventListener("click", fiftyFiftySkip);

    if (els.modeCards) {
      els.modeCards.forEach(card => {
        card.addEventListener("click", () => {
          els.modeCards.forEach(c => c.classList.remove("is-selected"));
          card.classList.add("is-selected");
          state.gameMode = card.dataset.mode;
        });
      });
    }

    els.editOkBtn.addEventListener("click", editMarkOk);
    els.editBadBtn.addEventListener("click", editMarkBad);
    els.editBackBtn.addEventListener("click", editPrev);
    els.editExitBtn.addEventListener("click", () => showScreen("welcome"));

    document.getElementById("quiz-title-q").addEventListener("click", showEditMode);

    loadQuestionsFromAPI();
  </script>
</body>
</html>
