<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Das Quiz</title>
  <style>
    :root {
      --bg: #051622;
      --shell: #071725;
      --shell-2: #03101b;
      --card: #0b2536;
      --primary: #1e88e5;
      --primary-dark: #0d47a1;
      --accent: #ff9800;
      --accent-soft: #ffb74d;
      --text-main: #f9fbff;
      --text-muted: #b7c3d1;
      --radius-l: 18px;
      --radius-s: 10px;
      --shadow-soft: 0 18px 40px rgba(0,0,0,0.35);
      --green-a: #64ffda;
      --green-b: #1de9b6;
      --red-a: #ff8a80;
      --red-b: #ff5252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0d2b45 0, #020c16 60%, #000 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    /* Fester Anker statt body { align-items: center }: die Karte wächst/schrumpft
       nach unten (neue Antwortoptionen, Joker-Buttons, ...), ohne dass sich ihr
       oberer Rand mit jeder Höhenänderung neu zentriert und "wandert". */
    .app {
      width: 100%;
      max-width: 540px;
      min-height: auto;
      margin: max(24px, 8vh) auto 0;
    }

    .screen {
      min-height: auto;
    }

    .hidden { display: none !important; }

    .fade-in {
      animation: fadeIn 0.32s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-card {
      width: min(540px, 100%);
      margin: 0 auto;
      background: linear-gradient(135deg, var(--shell), var(--shell-2));
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      padding: 28px 24px 26px;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      inset: -100px;
      background:
        radial-gradient(circle at top left, rgba(30,136,229,0.32), transparent 58%),
        radial-gradient(circle at bottom right, rgba(255,152,0,0.18), transparent 58%);
      pointer-events: none;
    }

    .welcome-card > * {
      position: relative;
      z-index: 1;
    }

    h1, p { margin: 0; }

    .welcome-card h1 {
      margin-bottom: 10px;
      font-size: clamp(30px, 4vw, 44px);
      color: var(--text-main);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }

    .welcome-card p {
      font-size: 16px;
      line-height: 1.45;
      margin-bottom: 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .field-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field-row .field {
      margin-bottom: 0;
    }

    .field-plz { flex: 0 0 110px; }
    .field-ort { flex: 1; }

    label {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      font-size: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    input[type="text"]::placeholder {
      color: #90a4ae;
    }

    .hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    .button-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 22px;
      justify-content: center;
    }

    .mode-select {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .mode-card {
      flex: 1 1 140px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      color: var(--text-main);
      font-family: inherit;
    }

    .mode-card-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mode-card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .mode-card:hover {
      border-color: rgba(255,255,255,0.25);
    }

    .mode-card.is-selected {
      border-color: var(--accent-soft);
      background: rgba(255,152,0,0.10);
      box-shadow: 0 0 0 1px rgba(255,152,0,0.35), 0 8px 20px rgba(255,152,0,0.15);
    }

    .mode-card.is-selected .mode-card-title {
      color: var(--accent-soft);
    }

    @media (max-width: 520px) {
      .mode-select { flex-direction: column; }
    }

    .joker-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 12px 0 18px;
    }

    .joker-btn {
      padding: 12px 24px;
      border-radius: var(--radius-s);
      border: 1.5px solid rgba(192,132,252,0.45);
      background: rgba(124,58,237,0.16);
      color: #d8b4fe;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .joker-btn:hover {
      background: rgba(124,58,237,0.26);
      border-color: rgba(192,132,252,0.7);
    }

    .fifty-btn {
      border-color: rgba(34,211,238,0.45);
      background: rgba(8,145,178,0.16);
      color: #67e8f9;
    }

    .fifty-btn:hover {
      background: rgba(8,145,178,0.26);
      border-color: rgba(34,211,238,0.7);
    }

    .fifty-btn .joker-count-badge {
      background: rgba(34,211,238,0.28);
    }

    .answer-row.eliminated {
      visibility: hidden;
      pointer-events: none;
    }

    .answer-row.crumbling {
      overflow: visible;
      pointer-events: none;
    }

    .answer-row.crumbling .letter,
    .answer-row.crumbling .answer-text {
      transition: opacity 0.3s ease, filter 0.3s ease;
      opacity: 0;
      filter: blur(1.5px);
    }

    .crumble-shards {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .crumble-shard {
      position: absolute;
      background: linear-gradient(135deg, #f8746b, #b91c1c);
      border-radius: 2px;
      animation: crumble-fall 0.6s ease-in forwards;
    }

    @keyframes crumble-fall {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translate(var(--dx, 0px), 52px) rotate(var(--rot, 90deg));
        opacity: 0;
      }
    }

    /* ── Skip-Joker: 3 zufällige Auflöse-Effekte für Frage + Antworten ── */

    .dissolve-letter {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Effekt 1: kurz vibrieren, dann in eine zufällige Richtung wegfliegen */
    @keyframes dissolve-vibrate-kf {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-2px, 1px) rotate(-3deg); }
      40% { transform: translate(2px, -1px) rotate(3deg); }
      60% { transform: translate(-2px, -1px) rotate(-2deg); }
      80% { transform: translate(2px, 1px) rotate(2deg); }
    }
    .dissolve-vibrate {
      animation: dissolve-vibrate-kf 0.09s ease-in-out infinite;
    }
    @keyframes dissolve-fly-kf {
      0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx, 60px), var(--dy, -40px)) rotate(var(--rot, 180deg)) scale(0.4); opacity: 0; }
    }
    .dissolve-fly {
      animation: dissolve-fly-kf 0.65s cubic-bezier(0.3,0,0.7,1) forwards;
      pointer-events: none;
    }

    /* Effekt 2: kurz glitchen, dann in Fragmente zersplittern */
    @keyframes dissolve-glitch-kf {
      0%, 100% { transform: translate(0,0); filter: none; }
      20% { transform: translate(-3px, 1px); filter: hue-rotate(40deg); }
      40% { transform: translate(3px, -2px); filter: hue-rotate(-40deg); }
      60% { transform: translate(-2px, 2px); filter: hue-rotate(20deg); }
      80% { transform: translate(2px, -1px); filter: hue-rotate(-20deg); }
    }
    .dissolve-glitch {
      animation: dissolve-glitch-kf 0.05s steps(2) infinite;
    }
    @keyframes dissolve-content-fade-kf {
      0% { opacity: 1; filter: blur(0); }
      100% { opacity: 0; filter: blur(4px); }
    }
    .dissolve-content-fade {
      animation: dissolve-content-fade-kf 0.5s ease-in forwards;
    }
    .dissolve-fragments {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }
    .dissolve-fragment {
      position: absolute;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      border-radius: 2px;
      animation: dissolve-fragment-kf 0.75s ease-out forwards;
    }
    @keyframes dissolve-fragment-kf {
      0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 0.95; }
      100% { transform: translate(var(--dx,0px), var(--dy,0px)) rotate(var(--rot,90deg)) scale(0.3); opacity: 0; }
    }

    /* Effekt 3: einsaugen – drehen, schrumpfen, nach oben verschwinden */
    @keyframes dissolve-vortex-kf {
      0% { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
      55% { opacity: 0.7; }
      100% { transform: scale(0) rotate(540deg) translateY(-50px); opacity: 0; }
    }
    .dissolve-vortex {
      animation: dissolve-vortex-kf 0.9s cubic-bezier(0.6,0,0.8,1) forwards;
      pointer-events: none;
      transform-origin: center center;
    }

    .joker-count-badge {
      background: rgba(192,132,252,0.28);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .joker-award {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px auto 0;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1.5px solid rgba(192,132,252,0.5);
      background: rgba(124,58,237,0.18);
      color: #d8b4fe;
      font-weight: 700;
      font-size: 14px;
      width: fit-content;
    }

    .joker-award.pop-in {
      animation: jokerPop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    @keyframes jokerPop {
      0% { opacity: 0; transform: scale(0.6) translateY(6px); }
      60% { opacity: 1; transform: scale(1.08) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: scale(0.985); }
    button:disabled { opacity: 0.55; cursor: default; transform: none; }

    .btn-primary,
    .continue-btn,
    .primary-btn {
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      color: #031019;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 12px 26px rgba(0,0,0,0.55), 0 0 18px rgba(255,152,0,0.55);
    }

    .btn-primary:hover,
    .continue-btn:hover,
    .primary-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .btn-secondary {
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1e88e5, #0d47a1);
      color: #f9fbff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 12px 26px rgba(0,0,0,0.55), 0 0 18px rgba(30,136,229,0.4);
      border: none;
      cursor: pointer;
    }

    .btn-secondary:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .hs-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .hs-tab {
      flex: 1 1 110px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.25;
    }

    .hs-tab:hover {
      border-color: rgba(255,255,255,0.25);
    }

    .hs-tab.is-active {
      border-color: var(--accent-soft);
      background: rgba(255,152,0,0.12);
      color: var(--accent-soft);
    }

    .hs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .hs-table th {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 6px 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      text-align: left;
    }

    .hs-table th.hs-score { text-align: right; }

    .hs-table td {
      padding: 10px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text-main);
      font-size: 15px;
    }

    .hs-rank {
      width: 32px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .hs-score {
      color: var(--accent-soft);
      font-weight: 800;
      text-align: right;
    }

    .hs-loading {
      color: var(--text-muted);
      text-align: center;
      padding: 24px 0;
      font-size: 15px;
    }

    /* ── Edit Mode ───────────────────────────────── */
    .edit-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .edit-badge {
      display: inline-block;
      background: #2a1550;
      border: 1px solid #6b3db0;
      color: #c084fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .edit-counter {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin-left: auto;
    }
    .edit-bad-count-label {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }
    .edit-question {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 14px;
    }
    .edit-answers {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .edit-answer {
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .edit-answer.is-correct {
      border-color: rgba(100,255,218,0.35);
      background: rgba(100,255,218,0.07);
      color: #fff;
    }
    .ea-label {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,0.25);
      min-width: 16px;
    }
    .edit-answer.is-correct .ea-label { color: #64ffda; }
    .edit-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .edit-btn {
      flex: 1;
      padding: 13px 0;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .edit-btn-ok {
      background: rgba(55,138,221,0.15);
      color: #378ADD;
      border: 1.5px solid rgba(55,138,221,0.4);
    }
    .edit-btn-bad {
      background: rgba(226,75,74,0.12);
      color: #e24b4a;
      border: 1.5px solid rgba(226,75,74,0.35);
    }
    .edit-btn-back {
      flex: 0 0 auto;
      padding: 13px 18px;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.45);
      border: 1.5px solid rgba(255,255,255,0.12);
    }
    .edit-btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    .edit-status {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      padding: 8px 0;
    }
    .edit-exit {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 0;
      display: block;
      text-align: center;
      width: 100%;
      margin-top: 4px;
    }
    .edit-exit:hover { color: rgba(255,255,255,0.6); }
    /* ── /Edit Mode ───────────────────────────────── */

    .continue-btn.is-disabled,
    .continue-btn:disabled {
      background: linear-gradient(135deg, #7f8790, #5d6670);
      color: rgba(255,255,255,0.7);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      filter: grayscale(0.25);
      cursor: default;
      pointer-events: none;
    }

    .quiz-screen {
      width: 100%;
      background: linear-gradient(135deg, var(--shell), var(--shell-2));
      border-radius: 28px;
      padding: 22px 24px 24px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    .quiz-screen::before {
      content: "";
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at top left, rgba(30,136,229,0.35), transparent 60%),
        radial-gradient(circle at bottom right, rgba(255,152,0,0.20), transparent 60%);
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
    }

    .quiz-screen > * {
      position: relative;
      z-index: 1;
    }

    /* ── Topbar: new 3-column header ── */
    /* ── Topbar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Left: player pill */
    .tb-player {
      background: #162035;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 18px 8px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tb-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(55,138,221,0.15);
      border: 1.5px solid rgba(55,138,221,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #378ADD;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    #ui-username {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
    }

    #ui-score {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      line-height: 1.2;
    }

    /* Center: three chips */
    .tb-chips {
      display: flex;
      gap: 8px;
    }

    .tb-chip {
      background: #162035;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 7px 18px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex-shrink: 0;
    }

    .c-label {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .c-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
    }

    .tb-gold { color: #f5a623; }

    /* Mute toggle (between player pill and chips) */
    .tb-mute {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #162035;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .tb-mute:hover { background: #1c2941; }

    .tb-mute.is-muted {
      border-color: rgba(200,40,60,0.5);
      background: rgba(180,30,50,0.12);
    }

    .tb-chips.level-3 .label-level {
      color: #ff8a50;
      text-shadow: 0 0 10px rgba(255,100,30,0.6);
    }

    /* Right: timer circle */
    #ui-timer {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(55,138,221,0.12);
      border: 1.5px solid rgba(55,138,221,0.35);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .tb-timer-num {
      font-size: 22px; font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }

    .tb-timer-sek {
      font-size: 8px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #ui-timer.is-penalty {
      background: rgba(180,30,50,0.2);
      border-color: rgba(200,40,60,0.7);
      box-shadow: 0 0 18px rgba(200,40,60,0.35);
    }

    #ui-timer.is-penalty .tb-timer-num { color: #ffb3b3; }

    /* progress-track removed */

    .question-box {
      border-radius: var(--radius-l);
      background: linear-gradient(135deg, rgba(5,31,52,0.98), rgba(9,35,56,0.98));
      border: 1px solid rgba(255,255,255,0.06);
      padding: 18px 20px 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.32);
      position: relative;
      text-align: center;
      min-height: auto;
      display: block;
    }

    .question-text {
      font-size: 20px;
      line-height: 1.35;
      color: var(--text-main);
      font-weight: 600;
      margin: 0;
      font-style: normal;
      letter-spacing: normal;
    }

    .go-card {
      background: #162035;
      border: 1px solid #2a3a55;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 16px;
    }
    .go-card-top {
      padding: 28px 24px 24px;
      text-align: center;
      border-bottom: 1px solid #2a3a55;
    }
    .go-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e24b4a;
      background: #2a1515;
      border: 1px solid #5a2020;
      border-radius: 6px;
      padding: 3px 10px;
      margin-bottom: 14px;
    }
    .go-player {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px;
    }
    .go-sub {
      font-size: 13px;
      color: #8899aa;
      margin: 0;
    }
    .go-stats {
      display: flex;
      border-bottom: 1px solid #2a3a55;
    }
    .go-stat {
      flex: 1;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .go-stat + .go-stat { border-left: 1px solid #2a3a55; }
    .go-stat-n {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }
    .go-stat-n.gold { color: #f5a623; }
    .go-stat-l {
      font-size: 10px;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .go-btns {
      padding: 16px;
      display: flex;
      gap: 10px;
    }
    .go-btn {
      border-radius: 999px;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      border: none;
    }
    .go-btn-primary {
      background: #c47a0a;
      color: #ffffff;
      flex: 2;
    }
    .go-btn-secondary {
      background: #1e3048;
      color: #ffffff;
      flex: 1;
      border: 1.5px solid #3a5070;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Answer button: base layout ── */
    .answer-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      border-radius: var(--radius-s);
      background: #1c2432;
      border: 2px solid rgba(255,255,255,0.10);
      overflow: hidden;
      cursor: pointer;
      transition:
        border-color 0.15s ease-out,
        box-shadow 0.15s ease-out;
      position: relative;
      padding: 0;
      min-height: 62px;
    }

    .answer-row:hover:not(.locked):not(.correct-state):not(.wrong-state):not(.clicked-state) {
      border-color: rgba(255,255,255,0.28);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* Letter badge */
    .answer-row .letter {
      width: 54px;
      min-width: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      color: #0d2236;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
      border-radius: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    /* Answer text */
    .answer-row .answer-text {
      font-size: 17px;
      color: var(--text-main);
      font-weight: 500;
      flex: 1;
      text-align: left;
      padding: 16px 18px;
      line-height: 1.3;
      background: #212b38;
    }

    /* Remove the ::before circle indicator */
    .answer-row::before { display: none; }

    /* ── Clicked state (yellow) ── */
    .answer-row.clicked-state {
      border-color: #f5e642;
      box-shadow: 0 0 0 1px #f5e642;
    }
    .answer-row.clicked-state .letter {
      background: #0d2236;
      color: #f5e642;
    }
    .answer-row.clicked-state .answer-text {
      background: #0d2236;
    }

    /* ── Correct state (green) ── */
    .answer-row.correct-state {
      border-color: #0aff2e;
      box-shadow: 0 0 0 1px #0aff2e, 0 0 18px rgba(10,255,46,0.25);
    }
    .answer-row.correct-state .letter {
      background: #0d2236;
      color: #0aff2e;
    }
    .answer-row.correct-state .answer-text {
      background: #0d2236;
    }

    /* ── Wrong state (red) ── */
    .answer-row.wrong-state {
      border-color: #f04040;
      box-shadow: 0 0 0 1px #f04040, 0 0 18px rgba(240,64,64,0.25);
    }
    .answer-row.wrong-state .letter {
      background: #0d2236;
      color: #f04040;
    }
    .answer-row.wrong-state .answer-text {
      background: #0d2236;
    }

    .below-panel {
      margin-top: 24px;
      min-height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .next-answer-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .next-answer-btn {
      width: 100%;
      padding: 18px 28px;
      border-radius: var(--radius-s);
      border: none;
      background: linear-gradient(135deg, #4a6cf7, #3b5bdb);
      color: #ffffff;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.03em;
      text-transform: none;
      box-shadow: 0 8px 24px rgba(59,91,219,0.45);
      min-width: unset;
      max-width: 100%;
      font-style: normal;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .next-answer-btn::before {
      content: ">";
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .next-answer-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(59,91,219,0.55);
    }

    .result-points {
      font-size: clamp(28px, 2.8vw, 48px);
      font-style: normal;
      font-weight: 800;
      line-height: 1;
      color: var(--accent-soft);
      text-shadow: 0 0 20px rgba(255,152,0,0.25);
    }

    /* Richtig-/Falsch-Feedbacktext bei Frageauflösung: gleiche Fontgröße wie
       die Frage selbst, statt der sonst größeren .result-points-Schrift. */
    .result-feedback-text {
      font-size: 20px;
    }

    .result-points-sub {
      display: inline-block;
      margin-top: 8px;
      font-size: 26px;
      color: #ffffff;
      -webkit-text-stroke: 2px var(--accent-soft);
      text-shadow: none;
    }

    /* Label-Teil ("Korrekte Antworten:" / "Score für Frage:") in gleicher
       Fontgröße wie die Frage selbst, weiß, fett, ohne Outline; die Zahl
       behält Fontgröße und Outline von .result-points-sub unverändert.
       margin-right verdoppelt den Abstand zur Zahl (zusätzlich zum
       Leerzeichen im Text ~5.4px -> Gesamtabstand ~10.8px). */
    .result-label {
      font-size: 20px;
      color: #ffffff;
      font-weight: 700;
      -webkit-text-stroke: 0;
      margin-right: 5px;
    }

    .result-value {
      display: inline-block;
    }

    /* Zahl bei "Korrekte Antworten" etwas kleiner als die Standard-Zahl-Größe
       von .result-points-sub (26px). */
    .result-value-correct {
      font-size: 22px;
    }

    /* Zahl bei "Score für Frage": Fontfarbe = Outline-Farbe (statt Weiß). */
    .result-value-solo {
      color: var(--accent-soft);
    }

    /* Effekte für die Zahl hinter "Score für Frage", gestaffelt nach
       Punktzahl (nur Modus Klassisch ohne KI-Fragen). */
    @keyframes scoreFadeSlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes scoreFadeFast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes scoreBounceExcited {
      0%, 100% { transform: translateY(0); }
      10% { transform: translateY(-10px); }
      20% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
      40% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      60% { transform: translateY(0); }
      70% { transform: translateY(-10px); }
      80% { transform: translateY(0); }
      90% { transform: translateY(-10px); }
    }
    @keyframes scoreFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .score-effect-fade-slow {
      animation: scoreFadeSlow 1s ease-in-out infinite;
    }
    .score-effect-fade-fast {
      animation: scoreFadeFast 0.7s ease-in-out infinite;
    }
    .score-effect-bounce {
      animation: scoreBounceExcited 1.75s ease-in-out 1,
                 scoreFloat 2.6s ease-in-out infinite 1.75s;
    }

    #result-total {
      font-size: clamp(30px, 3.2vw, 56px) !important;
      color: var(--accent-soft);
      font-weight: 800;
      text-shadow: 0 0 20px rgba(255,152,0,0.25);
    }

    .small-info {
      font-size: 18px;
      color: var(--text-muted);
      font-style: normal;
    }

    .continue-btn {
      min-width: 220px;
      min-height: unset;
      font-size: 15px;
      font-style: normal;
      border: none;
    }


    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .quiz-screen {
        padding: 18px 20px 20px;
      }

      .topbar { gap: 8px; }
      .tb-player { padding: 6px 12px 6px 6px; gap: 7px; }
      .tb-avatar { width: 30px; height: 30px; font-size: 12px; }
      #ui-username { font-size: 12px; }
      .tb-chip { padding: 6px 12px; }
      .c-val { font-size: 14px; }
      #ui-timer { width: 46px; height: 46px; }
      .tb-timer-num { font-size: 18px; }
      .tb-mute { width: 32px; height: 32px; font-size: 14px; }

      .question-text {
        font-size: 18px;
      }

      .result-feedback-text {
        font-size: 18px;
      }

      .result-label {
        font-size: 18px;
      }

      .answer-row {
        padding: 14px 16px;
      }

      .answer-row .answer-text {
        font-size: 16px;
      }

      .next-answer-btn,
      .continue-btn,
      .game-over-actions .continue-btn {
        min-width: 100%;
      }

      .welcome-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="screen-welcome" class="screen">
      <div class="welcome-card">
        <h1>Das <span id="quiz-title-q" style="cursor:default;">Q</span>uiz</h1>
        <p>Wie heißt du?</p>

        <div class="field">
          <label for="username">Name</label>

        </div>

          <label for="plz">Postleitzahl</label>

        </div>

        <div class="mode-select" id="mode-select">
          <button type="button" class="mode-card is-selected" id="mode-card-new" data-mode="new">
            <span class="mode-card-title">Neues Spielprinzip</span>

          </button>

        <div class="button-row">

    <section id="screen-edit" class="screen hidden">

          <span class="edit-badge">Edit Mode</span>
          <span class="edit-counter"><span id="edit-idx">1</span> / <span id="edit-total">–</span></span>
          <span class="edit-bad-count-label">Aussortiert: <span id="edit-bad-count">0</span></span>

      <div class="welcome-card">

          <button type="button" class="hs-tab" data-mode="classic-ki">Klassisch mit KI-Fragen</button>
          <button type="button" class="hs-tab" data-mode="classic-solo">Klassisch Einzelspieler Score</button>
        </div>
        <div id="highscore-list"><p class="hs-loading">Wird geladen…</p></div>
        <div class="button-row" style="margin-top: 24px;">

        </div>

    <section id="screen-quiz" class="screen quiz-screen hidden">
      <div class="topbar">

            <div id="ui-username">Username</div>

          </div>

        <button id="mute-btn" class="tb-mute" type="button" aria-label="Sound aus">

<div class="question-box">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, increment, arrayUnion, collection, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJ4iLxCmCDq_wLIADbVwupGoaHgktVZDU",
      authDomain: "gisaquiz-cbae5.firebaseapp.com",
      projectId: "gisaquiz-cbae5",
      storageBucket: "gisaquiz-cbae5.firebasestorage.app",
      messagingSenderId: "441662458718",
      appId: "1:441662458718:web:b61ae975e480b9d2339dcf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Ranglisten sind jetzt pro Postleitzahl statt pro Spieler: ein Dokument pro PLZ
    // in der bereits freigeschalteten "scores"-Collection (Dokument-ID = PLZ). Jeder
    // Spieldurchlauf addiert seinen Score zum Bezirks-Gesamtscore. Getrennt nach Modus
    // über zwei Feldpaare (score/gamesNew, scoreClassic/gamesClassic) – orderBy()
    // liefert nur Dokumente, die das jeweilige Feld überhaupt besitzen, das trennt die
    // Ranglisten ohne where()/Composite-Index/neue Security Rule.
    function scoreFieldNames(mode) {
      if (mode === "classic") return { score: "scoreClassic", games: "gamesClassic" };
      if (mode === "classic-ki") return { score: "scoreClassicKi", games: "gamesClassicKi" };
      return { score: "score", games: "gamesNew" };
    }

    window.saveScore = async function(plz, score, mode) {
      if (!plz || !score || score <= 0) return;
      const { score: scoreField, games: gamesField } = scoreFieldNames(mode);
      try {
        await setDoc(doc(db, "scores", plz), {
          plz,
          [scoreField]: increment(score),
          [gamesField]: increment(1)
        }, { merge: true });
      } catch (e) {
        console.warn("Score konnte nicht gespeichert werden:", e);
      }
    };

    const PLZ_PATTERN = /^\d{5}$/;

    window.loadHighscores = async function(mode) {
      const { score: scoreField, games: gamesField } = scoreFieldNames(mode);
      try {
        const q = query(collection(db, "scores"), orderBy(scoreField, "desc"), limit(10));
        const snap = await getDocs(q);
        return snap.docs.map(d => {
          const data = d.data();
          const total = data[scoreField] || 0;
          const games = data[gamesField] || 0;
          // Alte Datensätze aus der Zeit vor der PLZ-Umstellung haben kein gültiges
          // plz-Feld (nur eine zufällige Dokument-ID, oder ein frei getipptes altes
          // "ort"-Feld ganz ohne PLZ) – dann bleibt die ganze Zelle leer, statt
          // Datenmüll aus der alten Struktur anzuzeigen.
          const hasValidPlz = PLZ_PATTERN.test(data.plz);
          return {
            plz: hasValidPlz ? data.plz : "",
            ort: hasValidPlz && typeof data.ort === "string" ? data.ort : "",
            score: total,
            games,
            average: games > 0 ? Math.round((total / games) * 10) / 10 : 0
          };
        });
      } catch(e) {
        console.warn("Highscores konnten nicht geladen werden:", e);
        return [];
      }
    };

    // "Gesehene Fragen"-Historie liegt ebenfalls pro PLZ auf demselben Dokument, statt
    // pro Profil in localStorage – so teilt sich ein ganzer Bezirk den Fortschritt
    // geräteübergreifend, und der Fragenzyklus wiederholt sich erst, wenn wirklich
    // alle Fragen eines Pools für diese PLZ einmal dran waren.
    window.loadDistrictSeenIds = async function(plz) {
      if (!plz) return [];
      try {
        const snap = await getDoc(doc(db, "scores", plz));
        if (snap.exists()) {
          const data = snap.data();
          return Array.isArray(data.seenQuestionIds) ? data.seenQuestionIds : [];
        }
        return [];
      } catch (e) {
        console.warn("Gesehene Fragen konnten nicht geladen werden:", e);
        return [];
      }
    };

    window.markQuestionSeen = async function(plz, questionId) {
      if (!plz || !questionId) return;
      try {
        await setDoc(doc(db, "scores", plz), {
          plz,
          seenQuestionIds: arrayUnion(questionId)
        }, { merge: true });
      } catch (e) { /* silent – Frage bleibt trotzdem lokal als gesehen markiert */ }
    };

    window.resetDistrictSeenIds = async function(plz, idsToRemove) {
      if (!plz) return;
      try {
        const ref = doc(db, "scores", plz);
        const snap = await getDoc(ref);
        const current = snap.exists() && Array.isArray(snap.data().seenQuestionIds) ? snap.data().seenQuestionIds : [];
        const removeSet = new Set(idsToRemove);
        const filtered = current.filter(id => !removeSet.has(id));
        await setDoc(ref, { plz, seenQuestionIds: filtered }, { merge: true });
      } catch (e) { /* silent */ }
    };

    // Ortsname zu einer PLZ dauerhaft am Bezirks-Dokument speichern, damit die
    // Highscore-Liste ihn direkt mitlesen kann statt bei jeder Anzeige neu nachzufragen.
    window.saveDistrictOrt = async function(plz, ort) {
      if (!plz || !ort) return;
      try {
        await setDoc(doc(db, "scores", plz), { plz, ort }, { merge: true });
      } catch (e) { /* silent */ }
    };

    // ── Klassisch Einzelspieler Score ───────────────────────────────────
    // Eigene Rangliste nur für den Klassisch-Modus (ohne KI-Fragen), unabhängig
    // von der bestehenden PLZ-Bezirks-Serie: hier zählt der beste EINZELNE
    // Spieldurchlauf nach der Formel (Schwierigkeitsgrad × Restsekunden) / 2
    // pro Frage. Jeder Durchlauf wird als eigenes Dokument in derselben, bereits
    // freigeschalteten "scores"-Collection abgelegt (addDoc statt PLZ als ID),
    // mit dem eigenen Feld "soloScore" – orderBy() liefert dadurch nur diese
    // Dokumente und lässt die PLZ-Bezirksdokumente unberührt.
    window.saveClassicSoloScore = async function(username, plz, score) {
      if (!username || !plz || !score || score <= 0) return;
      try {
        await addDoc(collection(db, "scores"), {
          username,
          plz,
          soloScore: score,
          timestamp: serverTimestamp()
        });
      } catch (e) {
        console.warn("Einzelspieler-Score konnte nicht gespeichert werden:", e);
      }
    };

    window.loadClassicSoloHighscores = async function() {
      try {
        const q = query(collection(db, "scores"), orderBy("soloScore", "desc"), limit(10));
        const snap = await getDocs(q);
        return snap.docs.map(d => {
          const data = d.data();
          return {
            username: typeof data.username === "string" && data.username ? data.username : "–",
            plz: typeof data.plz === "string" ? data.plz : "",
            score: data.soloScore || 0
          };
        });
      } catch (e) {
        console.warn("Einzelspieler-Highscores konnten nicht geladen werden:", e);
        return [];
      }
    };

      skipEffect2: new Audio("Sound/Skip_Question_Effect_2_442873__euanmj__puffofsmoke.wav"),
      skipEffect3: new Audio("Sound/Skip_Question_Effect_3_670185__robinhood76__11342-breath-ghost-vanish.wav"),
      fiftyEffect1: new Audio("Sound/50-50-1--770971__poundsounduk__ui_pop_up_03.wav"),
      fiftyEffect2: new Audio("Sound/50-50-2--825573__akelley6__menu-option.wav"),
      fiftyEffect3: new Audio("Sound/50-50-3--858836__tony_cannoli__pop-sound.wav")
    };

    function playSound(name) {
      if (state.soundMuted) return;
      const sfx = sounds[name];
      if (!sfx) return;
      sfx.currentTime = 0;
      sfx.play().catch(() => {});
    }

    function updateMuteButton() {
      if (!els.muteBtn) return;
      els.muteBtn.classList.toggle("is-muted", state.soundMuted);
      els.muteIcon.textContent = state.soundMuted ? "🔇" : "🔊";
      els.muteBtn.setAttribute("aria-label", state.soundMuted ? "Sound an" : "Sound aus");
    }

    if (els.muteBtn) {
      updateMuteButton();
      els.muteBtn.addEventListener("click", () => {
        state.soundMuted = !state.soundMuted;
        localStorage.setItem("soundMuted", state.soundMuted ? "1" : "0");
        updateMuteButton();
      });
    }

    function parseCsv(text) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.split(";"))
        .filter(cols => cols.length >= 7 && /^\d+$/.test(cols[0]))
        .map(cols => ({
          id: cols[0].trim(),
          question: cols[1].trim(),
          answers: [cols[2].trim(), cols[3].trim(), cols[4].trim()],
          correctPosition: Number(cols[5].trim()),
          difficulty: clampDifficulty(Number(cols[6].trim()))
        }))
        .filter(q => q.question && q.answers.every(Boolean) && q.correctPosition >= 1 && q.correctPosition <= 3);
    }

    function clampDifficulty(value) {
      return Math.max(1, Math.min(3, value || 1));
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function isClassicMode() {
      return state.gameMode === "classic" || state.gameMode === "classic-ki";
    }

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.add("hidden"));
      screens[name].classList.remove("hidden");
    }

    function resetRun() {
      clearInterval(state.timerId);
      state.flowToken += 1;
      state.round = 1;
      state.totalScore = 0;
      state.timerValue = 0;
      state.currentQuestion = null;
      state.currentDifficulty = 1;
      state.currentVisibleAnswers = 0;
      state.selectedMultiplier = 3;
      state.correctStreak = 0;
      state.questionsPlayed = 0;
      state.correctAnswers = 0;
      state.usedIds = new Set();
      state.jokersLeft = 3;
      state.fiftyFiftyLeft = 3;
      state.fiftyAnimating = false;
      state.hardCorrectCount = 0;
      state.classicSoloScore = 0;
      state.lastClassicSoloPoints = 0;

    }

    function resetQuizUi() {
      clearInterval(state.timerId);
      clearGameOverMode();
      restoreBelowPanelStructure();
      state.fiftyAnimating = false;
      state.roundAnswered = false;
      state.pendingGameOver = false;
      els.uiTimerNum.textContent = "0";

      if (els.uiWert) { els.uiWert.textContent = "–"; }
      els.answers.innerHTML = "";
      // Reste eines Skip-Joker-Auflöse-Effekts vom questionBox-Element entfernen
      // (es wird zwischen Runden nicht neu erstellt, anders als die Antworten).
      const questionBox = document.querySelector(".question-box");
      if (questionBox) {
        questionBox.classList.remove("dissolve-glitch", "dissolve-content-fade", "dissolve-vortex");
        questionBox.style.overflow = "";

      }
      els.nextAnswerWrap.className = "next-answer-wrap hidden";

      if (els.jokerAward) els.jokerAward.className = "joker-award hidden";
      els.resultPoints.className = "result-points hidden";
      els.resultInfo.className = "small-info hidden";
      els.resultTotal.className = "result-points hidden";
      els.continueBtn.className = "continue-btn hidden";
      els.continueBtn.disabled = false;
      els.restartBtn.className = "continue-btn hidden";

    function updateTimerUrgency() {
      if (!els.uiTimer) return;
      els.uiTimer.classList.toggle("is-penalty", state.timerValue >= 11);
      // Live-update Wert during penalty phase
      if (state.currentVisibleAnswers > 0 && els.uiWert) {
        const base = getBasePoints();
        const penalty = Math.max(0, state.timerValue - 10);
        const current = Math.max(0, base - penalty);
        els.uiWert.textContent = `${current} Pkt`;
      }
    }

    function tickTimer() {
      state.timerId = setInterval(() => {
        state.timerValue += 1;
        els.uiTimerNum.textContent = String(state.timerValue);
        updateTimerUrgency();
      }, 1000);
    }

    function startTimer() {
      clearInterval(state.timerId);
      state.timerValue = 0;
      els.uiTimerNum.textContent = "0";
      els.uiTimer.classList.remove("is-penalty");
      updateTimerUrgency();
      tickTimer();
    }

    // Setzt den hochzählenden Timer des "Neuen Spielprinzips" unverändert fort
    // (z.B. nach der kurzen Pause während der 50:50-Joker-Animation), analog zu
    // resumeTimerClassic() für die beiden Klassisch-Modi.
    function resumeTimer() {
      clearInterval(state.timerId);
      tickTimer();
    }

    function stopTimer() {
      clearInterval(state.timerId);
    }

    function getNextDifficulty() {
      if (state.correctStreak === 0) return 1;
      if (state.correctStreak === 1) return 2;
      if (state.correctStreak === 2) return 2;
      if (state.correctStreak === 3) return 3;
      return 1 + Math.floor(Math.random() * 3);
    }

    // Merkt sich pro Postleitzahl (nicht pro Person), welche Fragen-IDs bereits
    // gespielt wurden – dauerhaft in Firestore (state.districtSeenIds ist der beim
    // Spielstart geladene In-Memory-Cache davon), damit neue Spielrunden aus demselben
    // Bezirk nicht sofort wieder dieselben Fragen ausspielen. Der Zyklus beginnt erst
    // von vorne, wenn wirklich alle Fragen des aktuellen Pools einmal dran waren.
    function pickQuestion() {
      const pool = state.gameMode === "classic-ki" ? KI_QUESTIONS : state.questions;
      if (!pool.length) return null;

      const poolIds = pool.map(q => q.id);
      const seen = state.districtSeenIds;

      // Dieser Pool wurde für diese PLZ komplett durchgespielt -> Zyklus neu starten.
      if (poolIds.length && poolIds.every(id => seen.has(id))) {
        poolIds.forEach(id => seen.delete(id));
        if (typeof window.resetDistrictSeenIds === "function") {
          window.resetDistrictSeenIds(state.plz, poolIds);
        }
      }

      const targetDifficulty = getNextDifficulty();
      const notUsedThisRound = q => !state.usedIds.has(q.id);
      const notSeenByDistrict = q => !seen.has(q.id);

      let available = pool.filter(q => q.difficulty === targetDifficulty && notUsedThisRound(q) && notSeenByDistrict(q));

      if (!available.length) {
        available = pool.filter(q => q.difficulty === targetDifficulty && notUsedThisRound(q));
      }

      if (!available.length) {
        available = pool.filter(q => notUsedThisRound(q) && notSeenByDistrict(q));
      }

      if (!available.length) {
        available = pool.filter(q => notUsedThisRound(q));
        if (!available.length) {
          state.usedIds.clear();
          available = [...pool];
        }
      }

      const picked = available[Math.floor(Math.random() * available.length)];
      state.usedIds.add(picked.id);
      seen.add(picked.id);
      if (typeof window.markQuestionSeen === "function") {
        window.markQuestionSeen(state.plz, picked.id);
      }
      return picked;
    }

    function createAnswerRow(index, text) {
      const button = document.createElement("button");
      button.className = "answer-row fade-in";
      button.type = "button";
      button.dataset.position = String(index + 1);

      const letter = document.createElement("div");
      letter.className = "letter";
      letter.textContent = LETTERS[index];

      const answerText = document.createElement("div");
      answerText.className = "answer-text";
      answerText.textContent = text;

      button.appendChild(letter);
      button.appendChild(answerText);
      button.addEventListener("click", () => {
        if (isClassicMode()) {
          chooseAnswerClassic(index + 1);
        } else {
          chooseAnswer(index + 1);
        }
      });

      return button;
    }

    function renderVisibleAnswers(count) {
      els.answers.innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        els.answers.appendChild(createAnswerRow(i, state.currentQuestion.answers[i]));
      }
      if (count > 0) playSound("reveal");
    }

    function difficultyLabel(difficulty) {
      return DIFFICULTY_LABELS[difficulty] || "einfach";
    }

    async function loadRound() {
      resetQuizUi();
      const token = ++state.flowToken;
      const question = pickQuestion();

      if (!question) {
        alert("Keine Fragen verfügbar.");
        showScreen("welcome");
        return;
      }

      state.currentQuestion = question;
      state.currentDifficulty = question.difficulty;
      state.currentVisibleAnswers = 0;
      state.selectedMultiplier = 3;

      els.uiUsername.textContent = state.username;
      if (els.uiAvatar) els.uiAvatar.textContent = (state.username[0] || "?").toUpperCase();

      const levelLabels = { 1: "Leicht", 2: "Mittel", 3: "Schwer" };
      const lvl = question.difficulty;
      els.uiRoundDifficulty.querySelector(".label-frage").textContent = String(state.round);
      els.uiRoundDifficulty.querySelector(".label-level").textContent = levelLabels[lvl] || "Leicht";
      els.uiRoundDifficulty.className = `tb-chips level-${lvl}`;

      els.uiScore.textContent = `${state.totalScore} Punkte`;
      els.questionText.textContent = question.question;
      els.questionText.classList.remove("fade-in");
      void els.questionText.offsetWidth;
      els.questionText.classList.add("fade-in");

      updateJokerUi();

      showScreen("quiz");

      await wait(1000);
      if (token !== state.flowToken) return;

      state.currentVisibleAnswers = 1;
      renderVisibleAnswers(1);
      startTimer();
      updateNextAnswerButton();
      revealJokerButton();

      // Show Wert once first answer option is visible
      if (els.uiWert) {
        els.uiWert.textContent = `${getBasePoints()} Pkt`;
      }
    }

    function updateNextAnswerButton() {
      const showButton = state.currentVisibleAnswers < 3;
      els.nextAnswerWrap.classList.toggle("hidden", !showButton);
    }

    function revealNextAnswer() {
      if (!state.currentQuestion) return;
      if (state.currentVisibleAnswers >= 3) return;

      state.currentVisibleAnswers += 1;
      state.selectedMultiplier = Math.max(1, 4 - state.currentVisibleAnswers);
      renderVisibleAnswers(state.currentVisibleAnswers);
      updateNextAnswerButton();

      // 50:50-Joker erst anbieten, wenn alle 3 Antwortoptionen sichtbar sind:
      // renderVisibleAnswers() baut die Antwortliste bei jedem weiteren Reveal
      // komplett neu auf, was eine bereits zerbröckelte Option sonst wieder
      // sichtbar machen würde.
      if (state.currentVisibleAnswers === 3) {
        revealFiftyFiftyButton();
      }

      // Update Wert to reflect new multiplier
      if (els.uiWert) {
        const base = getBasePoints();
        const penalty = Math.max(0, state.timerValue - 10);
        els.uiWert.textContent = `${Math.max(0, base - penalty)} Pkt`;
      }
    }

    function getBasePoints() {
      return state.currentDifficulty * 10 * state.selectedMultiplier;
    }

    // ── Klassisch-Modus ──────────────────────────────────────────────────

    function updateJokerUi() {
      const isClassic = isClassicMode();
      if (els.jokerCountBadge) els.jokerCountBadge.textContent = String(state.jokersLeft);
      if (els.fiftyCountBadge) els.fiftyCountBadge.textContent = String(state.fiftyFiftyLeft);
      if (els.uiWertLabel && els.uiWert) {
        if (isClassic) {
          els.uiWertLabel.textContent = "Joker";
          els.uiWert.textContent = String(state.jokersLeft);
        } else {
          els.uiWertLabel.textContent = "Wert";
        }
      }
    }

    // Blendet den Joker-Button ein, sofern noch Joker übrig sind. Im
    // Klassisch-Modus erst mit Verzögerung nach Antwort C (siehe
    // loadRoundClassic()), im neuen Spielprinzip direkt mit der ersten
    // Antwortoption (siehe loadRound()).
    function revealJokerButton() {
      if (state.roundAnswered) return;
      if (state.jokersLeft <= 0) return;
      if (!els.jokerWrap) return;
      els.jokerWrap.classList.remove("hidden", "fade-in");
      void els.jokerWrap.offsetWidth;
      els.jokerWrap.classList.add("fade-in");
    }

    // 50:50-Joker: in allen drei Spielmodi verfügbar, erscheint zusammen mit
    // dem Skip-Joker.
    function revealFiftyFiftyButton() {
      if (state.roundAnswered) return;
      if (state.fiftyFiftyLeft <= 0) return;
      if (!els.fiftyWrap) return;
      els.fiftyWrap.classList.remove("hidden", "fade-in");
      void els.fiftyWrap.offsetWidth;
      els.fiftyWrap.classList.add("fade-in");
    }

    // ── Skip-Joker: 3 zufällige Auflöse-Effekte ─────────────────────────
    // Beim Klick auf "Frage überspringen" lösen sich Frage und Antworten
    // sichtbar auf, bevor (wie gehabt) automatisch die nächste Frage lädt.

    function splitTextIntoLetterSpans(el) {
      const text = el.textContent;
      el.textContent = "";
      const spans = [];
      for (const ch of text) {
        const span = document.createElement("span");
        span.className = "dissolve-letter";
        span.textContent = ch === " " ? " " : ch;
        el.appendChild(span);
        spans.push(span);
      }
      return spans;
    }

    // Erzeugt einen Schwall kleiner Fragmente, die aus `el` herausfliegen,
    // während der eigentliche Inhalt verblasst (für Effekt "Zersplittern").
    function burstFragments(el, count) {
      el.style.overflow = "visible";
      const container = document.createElement("div");
      container.className = "dissolve-fragments";
      for (let i = 0; i < count; i += 1) {
        const frag = document.createElement("span");
        frag.className = "dissolve-fragment";
        const size = 6 + Math.random() * 12;
        frag.style.left = `${Math.random() * 100}%`;
        frag.style.top = `${Math.random() * 100}%`;
        frag.style.width = `${size}px`;
        frag.style.height = `${size}px`;
        frag.style.setProperty("--dx", `${(Math.random() - 0.5) * 220}px`);
        frag.style.setProperty("--dy", `${(Math.random() - 0.5) * 160 - 30}px`);
        frag.style.setProperty("--rot", `${(Math.random() - 0.5) * 400}deg`);
        frag.style.animationDelay = `${Math.random() * 100}ms`;
        container.appendChild(frag);
      }
      el.appendChild(container);
    }

    // Effekt 1: Buchstaben/Antworten vibrieren kurz, fliegen dann in eine
    // zufällige Richtung weg.
    function runVibrateFlyEffect(targets, onDone) {
      targets.forEach(el => {
        el.style.setProperty("--dx", `${(Math.random() - 0.5) * 260}px`);
        el.style.setProperty("--dy", `${(Math.random() - 0.5) * 160 - 60}px`);
        el.style.setProperty("--rot", `${(Math.random() - 0.5) * 480}deg`);
        el.classList.add("dissolve-vibrate");
      });
      window.setTimeout(() => {
        targets.forEach(el => {
          el.classList.remove("dissolve-vibrate");
          el.classList.add("dissolve-fly");
        });
      }, 260);
      window.setTimeout(onDone, 260 + 650);
    }

    // Effekt 2: kurzes Glitchen, dann Zersplittern in Fragmente.
    function runShatterEffect(targets, onDone) {
      targets.forEach(el => el.classList.add("dissolve-glitch"));
      window.setTimeout(() => {
        targets.forEach(el => {
          el.classList.remove("dissolve-glitch");
          el.classList.add("dissolve-content-fade");
          burstFragments(el, 16);
        });
      }, 200);
      window.setTimeout(onDone, 200 + 750);
    }

    // Effekt 3: Einsaugen – drehen, schrumpfen, nach oben verschwinden.
    function runVortexEffect(targets, onDone) {
      targets.forEach((el, i) => {
        el.style.animationDelay = `${i * 60}ms`;
        el.classList.add("dissolve-vortex");
      });
      window.setTimeout(onDone, 900 + (targets.length * 60));
    }

    // Wählt zufällig einen der drei Effekte aus und wendet ihn auf die
    // aktuelle Frage (Buchstabe für Buchstabe bei Effekt 1) sowie alle
    // sichtbaren Antwortoptionen an.
    function runSkipDissolveEffect(onDone) {
      const questionBox = document.querySelector(".question-box");
      const answerRows = [...els.answers.children];
      const effectIndex = Math.floor(Math.random() * 3);

      if (effectIndex === 0) {
        playSound("skipEffect1");
        const letterSpans = splitTextIntoLetterSpans(els.questionText);
        runVibrateFlyEffect([...letterSpans, ...answerRows], onDone);
      } else if (effectIndex === 1) {
        playSound("skipEffect2");
        runShatterEffect([questionBox, ...answerRows], onDone);
      } else {
        playSound("skipEffect3");
        runVortexEffect([questionBox, ...answerRows], onDone);
      }
    }

    // Lässt eine Antwortoption in kleine Splitter zerbröckeln und danach
    // unsichtbar werden (visibility:hidden statt display:none), damit die
    // übrigen Antwortoptionen ihre Position nicht verändern.
    function crumbleAnswerRow(row, onDone) {
      const shardContainer = document.createElement("div");
      shardContainer.className = "crumble-shards";
      const shardCount = 14;
      for (let i = 0; i < shardCount; i += 1) {
        const shard = document.createElement("span");
        shard.className = "crumble-shard";
        const size = 5 + Math.random() * 9;
        shard.style.left = `${Math.random() * 100}%`;
        shard.style.top = `${Math.random() * 100}%`;
        shard.style.width = `${size}px`;
        shard.style.height = `${size}px`;
        shard.style.setProperty("--dx", `${(Math.random() - 0.5) * 70}px`);
        shard.style.setProperty("--rot", `${(Math.random() - 0.5) * 220}deg`);
        shard.style.animationDelay = `${Math.random() * 120}ms`;
        shardContainer.appendChild(shard);
      }
      row.appendChild(shardContainer);
      row.classList.add("crumbling");

      window.setTimeout(() => {
        row.classList.remove("crumbling");
        row.classList.add("eliminated");
        shardContainer.remove();
        if (onDone) onDone();
      }, 650);
    }

    // Effekt 2 (50:50-Joker): vibriert kurz, fliegt dann in eine zufällige
    // Richtung weg – nutzt dieselben Bausteine wie der Skip-Joker-Effekt,
    // hier auf eine einzelne Antwortoption angewendet.
    function flyAwayAnswerRow(row, onDone) {
      runVibrateFlyEffect([row], () => {
        row.classList.remove("dissolve-fly");
        row.classList.add("eliminated");
        if (onDone) onDone();
      });
    }

    // Effekt 3 (50:50-Joker): dreht sich, schrumpft und verschwindet nach oben.
    function vortexAwayAnswerRow(row, onDone) {
      runVortexEffect([row], () => {
        row.classList.remove("dissolve-vortex");
        row.classList.add("eliminated");
        if (onDone) onDone();
      });
    }

    // Wählt zufällig einen der drei Auflöse-Effekte für die vom 50:50-Joker
    // gestrichene Antwortoption.
    function eliminateAnswerRowWithEffect(row, onDone) {
      const effectIndex = Math.floor(Math.random() * 3);
      if (effectIndex === 0) {
        playSound("fiftyEffect1");
        crumbleAnswerRow(row, onDone);
      } else if (effectIndex === 1) {
        playSound("fiftyEffect2");
        flyAwayAnswerRow(row, onDone);
      } else {
        playSound("fiftyEffect3");
        vortexAwayAnswerRow(row, onDone);
      }
    }

    function fiftyFiftySkip() {
      if (state.roundAnswered) return;
      if (state.fiftyFiftyLeft <= 0) return;
      if (!state.currentQuestion) return;
      if (state.fiftyAnimating) return;

      const correctPos = state.currentQuestion.correctPosition;
      const wrongButtons = [...els.answers.children].filter(btn =>
        Number(btn.dataset.position) !== correctPos &&
        !btn.classList.contains("eliminated") &&
        !btn.disabled
      );
      if (!wrongButtons.length) return;

      const pick = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
      const token = state.flowToken;
      const wasClassic = isClassicMode();

      state.fiftyAnimating = true;
      stopTimer();
      pick.disabled = true;

      eliminateAnswerRowWithEffect(pick, () => {
        state.fiftyAnimating = false;
        if (token !== state.flowToken) return;
        if (wasClassic) {
          resumeTimerClassic(token);
        } else {
          resumeTimer();
        }
      });

      state.fiftyFiftyLeft -= 1;
      if (els.fiftyCountBadge) els.fiftyCountBadge.textContent = String(state.fiftyFiftyLeft);
      if (state.fiftyFiftyLeft <= 0 && els.fiftyWrap) els.fiftyWrap.classList.add("hidden");
    }

    // Kleine Pop-Animation im Ergebnis-Screen, wenn ein neuer Joker
    // freigespielt wurde (alle 5 richtigen Antworten, bzw. im Modus
    // "Klassisch mit KI-Fragen" alle 3 richtig beantworteten Level-3-Fragen).
    function showJokerAwardAnimation(message) {
      if (!els.jokerAward) return;
      if (message) els.jokerAward.textContent = message;
      els.jokerAward.classList.remove("hidden", "pop-in");
      void els.jokerAward.offsetWidth;
      els.jokerAward.classList.add("pop-in");
    }

    async function loadRoundClassic() {
      resetQuizUi();
      const token = ++state.flowToken;
      const question = pickQuestion();

      if (!question) {
        alert("Keine Fragen verfügbar.");
        showScreen("welcome");
